<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskBoard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #1e293b;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 24px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        h1 { font-size: 28px; }
        #stats { color: #94a3b8; font-size: 14px; }
        .new-card {
            background: #0f172a;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .new-card input, .new-card textarea {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        .new-card input { flex: 1; min-width: 200px; }
        .new-card textarea { flex: 2; min-width: 250px; resize: vertical; min-height: 36px; }
        .new-card button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
        .new-card button:hover { background: #2563eb; }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .column {
            background: #0f172a;
            border-radius: 8px;
            padding: 16px;
            min-height: 400px;
        }
        .column h2 {
            font-size: 16px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }
        .column h2 .count {
            background: #334155;
            color: #e2e8f0;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
        }
        .card {
            background: #1e293b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 3px solid #3b82f6;
        }
        .card .title { font-weight: 600; margin-bottom: 4px; }
        .card .desc { font-size: 13px; color: #94a3b8; margin-bottom: 8px; white-space: pre-wrap; }
        .card .actions { display: flex; gap: 4px; }
        .card button {
            background: #334155;
            color: #e2e8f0;
            border: none;
            padding: 4px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        .card button:hover { background: #475569; }
        .card button.del { background: #7f1d1d; }
        .card button.del:hover { background: #991b1b; }
        @media (max-width: 768px) {
            .board { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <h1>TaskBoard 1</h1>
        <div id="stats">…</div>
    </header>

    <form class="new-card" id="new-card-form">
        <input type="text" id="new-title" placeholder="Titre de la carte" required maxlength="200">
        <textarea id="new-desc" placeholder="Description (optionnelle)" maxlength="2000"></textarea>
        <button type="submit">Ajouter</button>
    </form>

    <div class="board">
        <div class="column" data-col="todo">
            <h2>À faire <span class="count" id="count-todo">0</span></h2>
            <div class="cards" id="cards-todo"></div>
        </div>
        <div class="column" data-col="doing">
            <h2>En cours <span class="count" id="count-doing">0</span></h2>
            <div class="cards" id="cards-doing"></div>
        </div>
        <div class="column" data-col="done">
            <h2>Terminé <span class="count" id="count-done">0</span></h2>
            <div class="cards" id="cards-done"></div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
